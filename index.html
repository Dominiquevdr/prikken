<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f4ee"><title>Wanneer kan iedereen?</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#27342f;background:#f7f4ee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:620px;margin:auto;padding:24px 16px 60px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-family:Georgia,serif;font-size:23px}button,input{font:inherit}button{border:0;border-radius:13px;padding:12px 16px;background:#294f43;color:white;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e8eae4;color:#294f43}button.danger{background:#f9e6e3;color:#922f2b}h1{font-family:Georgia,serif;font-size:33px;line-height:1.14;margin:0 0 10px}h2{font-family:Georgia,serif;font-size:22px}p{color:#637069;line-height:1.5}.card{background:white;border:1px solid #e8e6df;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 5px 25px #27342f08}.muted{color:#68766e;font-size:14px}.stack{display:grid;gap:13px}label{display:block;font-size:14px;font-weight:650;margin:8px 0}input[type=text],input[type=date],input[type=password]{width:100%;padding:13px;border:1px solid #d4d9d2;border-radius:11px;background:#fff;color:#26392e}input[type=checkbox]{accent-color:#294f43;width:20px;height:20px}.option{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #e0e5df;border-radius:12px;cursor:pointer}.option:has(input:checked){background:#edf5ef;border-color:#9fbea8}.option label{margin:0;flex:1;cursor:pointer}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.hidden{display:none!important}.pill{font-size:12px;padding:5px 10px;border-radius:20px;background:#e9f1e9;color:#315d45}.entry{padding:13px 0;border-bottom:1px solid #eee}.entry:last-child{border-bottom:0}.count{font-weight:700;color:#294f43}.notice{border-radius:12px;padding:13px;background:#fff3e0;color:#76521d;font-size:14px}.error{background:#ffe9e6;color:#8b2824}.success{background:#e9f4e9;color:#315c3e}.date-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px}.wide{width:100%}a{color:#294f43}footer{margin-top:30px;font-size:12px;color:#879087;text-align:center}</style></head><body><div class="wrap"><header><div class="brand">✳ Samen plannen</div><button class="secondary" id="homeBtn">Mijn afspraken</button></header><div id="status" class="hidden notice"></div><main id="app"></main><footer>Een eenvoudige datumplanner voor familie en vrienden</footer></div><script type="module">
// Vervang onderstaande waarden door je eigen Firebase-webconfiguratie.
const firebaseConfig = {apiKey:'AIzaSyDkZEKMiD-m5b7hUx64L6PDN4FCOA_v4yE',authDomain:'prikken.firebaseapp.com',projectId:'prikken',storageBucket:'prikken.firebasestorage.app',messagingSenderId:'1059410750883',appId:'1:1059410750883:web:d86de3648e0b0d7b207e16',measurementId:'G-J2NPSP6HS7'};
const configured = firebaseConfig.apiKey !== 'VUL_HIER_IN';
const appEl=document.querySelector('#app'), statusEl=document.querySelector('#status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID();const fmt=d=>new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
const base=location.origin+location.pathname;const linkFor=x=>base+'?a='+encodeURIComponent(x);
let db,auth,user,unsub=()=>{},unsubAuth=()=>{};
const show=(msg,type='')=>{statusEl.textContent=msg;statusEl.className='notice '+type;};const clear=()=>statusEl.className='hidden notice';
function view(html){unsub();unsub=()=>{};appEl.innerHTML=html;}
function err(e){console.error(e);show('Er ging iets mis: '+(e.code||e.message||'onbekende fout')+'. Controleer je instellingen en probeer opnieuw.','error')}
if(!configured){view(`<h1>Bijna klaar!</h1><div class="card"><p>De planner is gebouwd. Om afspraken tussen telefoons te synchroniseren, moet je eenmalig je gratis Firebase-project koppelen.</p><p class="muted">Open het meegeleverde bestand README.md voor de stappen. Daarna werkt deze pagina online.</p></div>`);show('Demo zonder database: vul eerst je Firebase-configuratie in.');}
else {try{const [{initializeApp},{getFirestore,doc,collection,addDoc,getDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,query,where,getDocs,writeBatch},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js')]);
const fb=initializeApp(firebaseConfig);db=getFirestore(fb);auth=getAuth(fb);const D=(...x)=>doc(db,...x), C=(...x)=>collection(db,...x);
const route=()=>{clear();unsubAuth();unsubAuth=()=>{};const appointment=new URLSearchParams(location.search).get('a');if(appointment)participant(appointment);else admin()};
const nav=(url)=>{history.pushState({},'',url);route()};window.addEventListener('popstate',route);document.querySelector('#homeBtn').onclick=()=>nav(base);
async function participant(aid){view('<p>Afspraak laden…</p>');const ref=D('appointments',aid);unsub=onSnapshot(ref,s=>{if(!s.exists()||s.data().deleted){view('<h1>Afspraak niet gevonden</h1><p>Deze link is ongeldig of de afspraak is verwijderd.</p>');return}renderParticipant(aid,s.data())},err)}
function renderParticipant(aid,a){const localKey='datumplanner:'+aid;let saved={};try{saved=JSON.parse(localStorage.getItem(localKey)||'{}')}catch{}const dates=(a.dates||[]).slice().sort();view(`<div class="pill" style="display:inline-block;margin-bottom:16px">${a.closed?'Afgesloten':'Datum kiezen'}</div><h1>${esc(a.title)}</h1><p>Vink alle datums aan waarop je kunt. Je kunt later via dezelfde telefoon je keuze aanpassen.</p><div class="card"><form id="vote" class="stack"><div><label for="name">Jouw naam</label><input id="name" type="text" maxlength="50" required placeholder="Bijvoorbeeld: Sanne" value="${esc(saved.name||'')}"></div><div><label>Wanneer kun je?</label><div class="stack">${dates.map(d=>`<div class="option"><input type="checkbox" id="d-${d}" value="${d}" ${saved.dates?.includes(d)?'checked':''} ${a.closed?'disabled':''}><label for="d-${d}">${esc(fmt(d))}</label></div>`).join('')}</div></div><button ${a.closed?'disabled':''} type="submit">Mijn keuzes opslaan</button></form>${a.closed?'<p class="muted">Deze afspraak is afgesloten. Stemmen kan niet meer.</p>':''}</div><div class="card"><h2>Wie kan wanneer?</h2><div id="votes">Antwoorden laden…</div></div>`);
const voteQuery=query(C('appointments',aid,'responses'));const off=onSnapshot(voteQuery,s=>{const votes=s.docs.map(d=>({id:d.id,...d.data()}));document.querySelector('#votes').innerHTML=dates.map(d=>{const names=votes.filter(v=>v.dates?.includes(d)).map(v=>v.name);return `<div class="entry"><div class="date-row"><strong>${esc(fmt(d))}</strong><span class="count">${names.length} ✓</span></div><div class="muted" style="margin-top:5px">${names.length?names.map(esc).join(', '):'Nog niemand'}</div></div>`}).join('')||'<p>Geen datums beschikbaar.</p>'},err);unsub=off;
document.querySelector('#vote').onsubmit=async e=>{e.preventDefault();if(a.closed)return;const name=document.querySelector('#name').value.trim();const chosen=dates.filter(d=>document.getElementById('d-'+d).checked);if(!name){show('Vul eerst je naam in.','error');return}const responseId=saved.id||id();const payload={name,dates:chosen,updatedAt:serverTimestamp()};try{await (saved.id?updateDoc(D('appointments',aid,'responses',responseId),payload):import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js').then(m=>m.setDoc(D('appointments',aid,'responses',responseId),payload)));localStorage.setItem(localKey,JSON.stringify({id:responseId,name,dates:chosen}));show('Je keuzes zijn opgeslagen!','success')}catch(e){err(e)}}}
function admin(){unsubAuth=onAuthStateChanged(auth,u=>{user=u;if(!u){view(`<h1>Mijn afspraken</h1><p>Log in om je eigen afspraken te beheren.</p><div class="card"><form id="login" class="stack"><label>E-mailadres<input type="text" id="email" required autocomplete="email"></label><label>Wachtwoord<input type="password" id="password" required autocomplete="current-password"></label><button>Inloggen</button></form></div><p class="muted">Maak je beheerdersaccount eerst aan in Firebase Authentication. Deelnemers hebben geen account nodig.</p>`);document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value.trim(),document.querySelector('#password').value)}catch(e){err(e)}};return}dashboard()})}
function dashboard(){view(`<div class="row between"><div><h1>Mijn afspraken</h1><p>Maak een afspraak en deel de unieke link.</p></div><button id="logout" class="secondary">Uitloggen</button></div><div class="card"><h2>Nieuwe afspraak</h2><form id="create" class="stack"><label>Titel<input id="title" type="text" required maxlength="100" placeholder="Bijvoorbeeld: Familie-etentje"></label><label>Voeg een datum toe<input id="date" type="date"></label><button type="button" class="secondary" id="addDate">+ Datum toevoegen</button><div id="chosenDates" class="stack"></div><button type="submit">Afspraak maken</button></form></div><h2>Bestaande afspraken</h2><div id="appointments">Laden…</div>`);document.querySelector('#logout').onclick=()=>signOut(auth);let dates=[];const refresh=()=>document.querySelector('#chosenDates').innerHTML=dates.sort().map(d=>`<div class="date-row"><span>${esc(fmt(d))}</span><button type="button" class="secondary" data-remove="${d}">×</button></div>`).join('');document.querySelector('#chosenDates').onclick=e=>{const d=e.target.dataset.remove;if(d){dates=dates.filter(x=>x!==d);refresh()}};document.querySelector('#addDate').onclick=()=>{const d=document.querySelector('#date').value;if(d&&!dates.includes(d)){dates.push(d);refresh()}};
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const title=document.querySelector('#title').value.trim();if(!dates.length){show('Voeg minstens één datum toe.','error');return}try{const ref=await addDoc(C('appointments'),{title,dates,ownerUid:user.uid,closed:false,deleted:false,createdAt:serverTimestamp()});show('Afspraak gemaakt! Kopieer de link hieronder.','success');dashboard()}catch(e){err(e)}};
const q=query(C('appointments'),where('ownerUid','==',user.uid));const off=onSnapshot(q,s=>{const arr=s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>!x.deleted);document.querySelector('#appointments').innerHTML=arr.length?arr.map(a=>`<div class="card"><div class="row between"><strong>${esc(a.title)}</strong><span class="pill">${a.closed?'Afgesloten':'Actief'}</span></div><p class="muted">${a.dates?.length||0} datums</p><div class="row"><button data-copy="${a.id}">Link kopiëren</button><button class="secondary" data-open="${a.id}">Bekijken</button><button class="secondary" data-close="${a.id}">${a.closed?'Heropenen':'Afsluiten'}</button><button class="danger" data-delete="${a.id}">Verwijderen</button></div></div>`).join(''):'<p>Je hebt nog geen afspraken.</p>'},err);unsub=off;
document.querySelector('#appointments').onclick=async e=>{const t=e.target,aid=t.dataset.copy||t.dataset.open||t.dataset.close||t.dataset.delete;if(!aid)return;if(t.dataset.copy){try{await navigator.clipboard.writeText(linkFor(aid));show('Link gekopieerd. Plak hem in WhatsApp.','success')}catch{show('Kopieer deze link: '+linkFor(aid))}}else if(t.dataset.open){nav(linkFor(aid))}else if(t.dataset.close){const a=await getDoc(D('appointments',aid));await updateDoc(a.ref,{closed:!a.data().closed})}else if(t.dataset.delete){if(confirm('Deze afspraak verwijderen? De link werkt daarna niet meer.'))await updateDoc(D('appointments',aid),{deleted:true,closed:true})}}}
route();}catch(e){err(e);view('<h1>Verbinding mislukt</h1><p>Controleer de Firebase-instellingen en probeer opnieuw.</p>')}}
</script></body></html>
